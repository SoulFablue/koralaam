  <title>头像拆层预览 · KoraLaam</title>
  <!-- 用途：对照原图与修补后的脸，检查眼镜能否独立拿走。 -->
  <style>
    body{margin:0;background:#faf9f6;color:#262720;font:16px/1.8 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:44px 25px}h1{font-size:26px;font-weight:500}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin:30px 0}figure{margin:0}img{width:100%;height:auto}figcaption{margin-top:12px;color:#71765c;font-size:14px}p{max-width:720px;color:#6f7263}a{color:inherit}@media(max-width:650px){.grid{grid-template-columns:1fr}.grid img{max-width:320px}}
  </style>

<body><main><a href="index.html">← 返回首页</a><h1>一张画，拆成可以活动的图层。</h1><p>保留你的蜡笔头像，拆出眼镜和眼睛，再用附近像素修补被遮住的脸。没有使用生图工具，也没有重新绘制人物。</p><div class="grid"><figure><img src="assets/avatar-original.jpg" alt="用户提供的原始头像"><figcaption>01 · 原图</figcaption></figure><figure><img src="assets/avatar-without-glasses.png" alt="去掉眼镜后，眼睛仍在脸上的头像"><figcaption>02 · 眼镜拿走后</figcaption></figure><figure><img src="assets/avatar-composed.png" alt="修补脸部与眼镜重新合成的头像"><figcaption>03 · 图层重新合成</figcaption></figure></div><p>首页会让头部轻微偏转、眼睛跟随，并在眼镜被拿走时出现疑惑反馈。这是单张图的拆层动作；抬头、低头的精细连续变形，需要后续补画稿。</p></main></body>
</html>
